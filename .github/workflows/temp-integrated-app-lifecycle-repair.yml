name: Temporary integrated app lifecycle repair

on:
  push:
    branches:
      - integration/full-product-acceptance

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: activate integrated app lifecycle repair'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-product-acceptance

      - name: Apply lifecycle repairs
        run: python3 tasks/temp_integrated_app_lifecycle_repair.py

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Build
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            -skip-testing:FineTuneUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/TestResults.xcresult

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FineTune FineTuneTests
          git diff --cached --check
          git commit -m 'fix: align integrated app lifecycle semantics'
          git push origin HEAD:integration/full-product-acceptance
