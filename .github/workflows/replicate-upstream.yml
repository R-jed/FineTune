name: Replicate upstream snapshot

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    if: github.repository == 'R-jed/FineTune' && github.head_ref == 'replication-snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Copy upstream main snapshot except workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ronitsingh10/FineTune.git /tmp/upstream
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git" /tmp/target
          cd /tmp/target
          git checkout main
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/upstream/ /tmp/target/
          rm -f .replica-bootstrap .replication-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
            exit 0
          fi
          git commit -m 'chore: replicate ronitsingh10/FineTune main snapshot at 2285279d'
          git push origin main
