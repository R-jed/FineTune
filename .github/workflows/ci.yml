name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Apply staged app lifecycle repair
        if: ${{ hashFiles('tasks/app_lifecycle_acceptance_repair.py') != '' }}
        run: python3 tasks/app_lifecycle_acceptance_repair.py

      - name: Build
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            -skip-testing:FineTuneUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/TestResults.xcresult

      - name: Print failing test summary
        if: failure()
        run: |
          echo '=== xcresult summary ==='
          xcrun xcresulttool get test-results summary --path build/TestResults.xcresult || true
          echo '=== xcresult tests ==='
          xcrun xcresulttool get test-results tests --path build/TestResults.xcresult || true
          echo '=== legacy xcresult fallback ==='
          xcrun xcresulttool get --legacy --format json --path build/TestResults.xcresult | \
            grep -E 'testStatus|identifier|message|failure|expected|actual' | tail -300 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7

      - name: Commit verified app lifecycle repair
        if: ${{ success() && hashFiles('tasks/app_lifecycle_acceptance_repair.py') != '' }}
        run: |
          rm tasks/app_lifecycle_acceptance_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            FineTune/Audio/Monitors/AudioProcessMonitor.swift \
            FineTune/Settings/SettingsManager.swift \
            FineTune/Audio/Engine/AudioEngine.swift \
            FineTuneTests/AudioEngineTapInitialStateTests.swift \
            FineTuneTests/AudioAppIdentityTests.swift \
            tasks/app_lifecycle_acceptance_repair.py
          git diff --cached --quiet && { echo "repair produced no staged changes"; exit 1; }
          git commit -m "fix: repair integrated app lifecycle"
          git push origin HEAD:integration/full-product-acceptance
