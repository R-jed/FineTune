name: Compose full product acceptance

on:
  push:
    branches:
      - integration/full-product-acceptance
    paths:
      - .github/workflows/integration-compose.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/full-product-acceptance
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add Biquad lifetime fix
        run: git cherry-pick c1e09abbf1920aeb47a43933056773edd31ab23f
      - name: Add tap generation fix using its ProcessTapController as the merge base
        run: |
          if ! git cherry-pick 2af531d32cf17a763e20f167f0893fd2d241db28; then
            git checkout --theirs FineTune/Audio/Engine/ProcessTapController.swift
            git add FineTune/Audio/Engine/ProcessTapController.swift
            git cherry-pick --continue
          fi
      - name: Reapply source meter and resolve intentional overlap
        run: |
          git show 6c32af3dc552b3aab270e81d9c59ecaa1dfd0078 -- FineTune/Audio/Engine/ProcessTapController.swift > /tmp/source-meter.patch
          git apply --3way /tmp/source-meter.patch || true
          python3 - <<'PY'
          from pathlib import Path

          path = Path("FineTune/Audio/Engine/ProcessTapController.swift")
          text = path.read_text()

          cleanup_conflict = '''<<<<<<< ours
                  if secondaryResources.isActive {
                      secondaryResources.destroy()
                  }
                  processorGenerations.resetSecondary()
          =======
                  _secondaryPeakLevel = 0
                  _secondaryMeterHoldFramesRemaining = 0
                  secondaryResources.destroy()
                  secondaryEQProcessor = nil
                  secondaryAutoEQProcessor = nil
                  secondaryLoudnessCompensator = nil
                  secondaryLoudnessEqualizerProcessor = nil
          >>>>>>> theirs'''
          cleanup_resolved = '''        if secondaryResources.isActive {
                      secondaryResources.destroy()
                  }
                  _secondaryPeakLevel = 0
                  _secondaryMeterHoldFramesRemaining = 0
                  processorGenerations.resetSecondary()'''

          barrier_conflict = '''<<<<<<< ours
                  // Reassign callback role AFTER role-dependent gain/channel state is swapped.
                  // DSP identity is already fixed by the IO proc's captured processor generation.
                  // The barrier publishes the remaining role metadata before the callback ID.
                  OSMemoryBarrier()
          =======
                  // Reassign callback role AFTER all state is swapped.
                  // The barrier ensures the HAL I/O thread sees the updated EQ processors,
                  // volume, meter state, ramp coefficient, and stereo channels BEFORE it sees the new
                  // _primaryCallbackID and switches to primary-role behavior.
                  OSMemoryBarrier()  // Flush all prior state stores before publishing new role
          >>>>>>> theirs'''
          barrier_resolved = '''        // Reassign callback role AFTER role-dependent gain/channel/meter state is swapped.
                  // DSP identity is already fixed by the IO proc's captured processor generation.
                  // The barrier publishes the remaining role metadata before the callback ID.
                  OSMemoryBarrier()'''

          old_rate_conflict = '''<<<<<<< ours
          =======
                  if let deviceSampleRate = try? primaryResources.aggregateDeviceID.readNominalSampleRate() {
                      _primaryMeterSampleRate = Float(deviceSampleRate)
                      rampCoefficient = 1 - exp(-1 / (Float(deviceSampleRate) * 0.030))
                      eqProcessor?.updateSampleRate(deviceSampleRate)
                      autoEQProcessor?.updateSampleRate(deviceSampleRate)
                      loudnessCompensator?.updateSampleRate(deviceSampleRate)
          
                      // LoudnessEqualizer is immutable — swap to new instance at new sample rate
                      if let oldLE = loudnessEqualizerProcessor {
                          let newLE = LoudnessEqualizer(
                              settings: oldLE.currentSettings,
                              sampleRate: Float(deviceSampleRate)
                          )
                          loudnessEqualizerProcessor = newLE
                          DispatchQueue.global(qos: .utility).asyncAfter(deadline: .now() + 0.5) { _ = oldLE }
                      }
                  }
          >>>>>>> theirs'''

          for name, old, new in [
              ("secondary cleanup", cleanup_conflict, cleanup_resolved),
              ("promotion barrier", barrier_conflict, barrier_resolved),
              ("obsolete destructive rate update", old_rate_conflict, ""),
          ]:
              if old not in text:
                  raise SystemExit(f"missing expected {name} conflict block")
              text = text.replace(old, new, 1)

          switch_anchor = '''        _peakLevel = 0
                  _primaryMeterHoldFramesRemaining = 0
                  let switchCallbackID = nextCallbackID'''
          switch_replacement = '''        _peakLevel = 0
                  _primaryMeterHoldFramesRemaining = 0
                  _primaryMeterSampleRate = Float(switchSampleRate)
                  let switchCallbackID = nextCallbackID'''
          if switch_anchor not in text:
              raise SystemExit("missing destructive switch meter anchor")
          text = text.replace(switch_anchor, switch_replacement, 1)

          if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
              raise SystemExit("merge markers remain")
          if "levelSmoothingFactor" in text:
              raise SystemExit("obsolete meter smoothing remains")
          if text.count("SourceActivityMeter.advance(") != 2:
              raise SystemExit("expected two source meter advance paths")
          if text.count("processorState: TapProcessorState") != 1:
              raise SystemExit("processor generation callback contract missing")
          if "processorGenerations.promoteSecondary()" not in text:
              raise SystemExit("processor generation promotion missing")
          path.write_text(text)
          PY
          git diff --check
          git add FineTune/Audio/Engine/ProcessTapController.swift
          git commit -m "fix: integrate source meter with tap generations"
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/integration-compose.yml
          git add -A
          git commit -m "chore: remove one-shot integration workflow"
      - name: Push integration branch
        run: git push origin HEAD:integration/full-product-acceptance
